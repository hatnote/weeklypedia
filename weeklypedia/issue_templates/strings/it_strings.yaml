about_heading: Chi siamo
about_text: >-
    Questo progetto recupera un elenco delle ultime modifiche della settimana utilizzando <a
    href="http://tools.wmflabs.org/">Wikimedia Tool Labs</a> e
    distribuisce le email tramite Sendy. Il codice e ulteriori informazioni sono disponibili su
    GitHub <a href="https://github.com/hatnote/weeklypedia">qui</a>. Realizzato da <a href="https://github.com/slaporte">Stephen
    LaPorte</a> e <a href="https://github.com/mahmoud">Mahmoud Hashemi</a>.

